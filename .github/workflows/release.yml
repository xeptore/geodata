name: Release

on:
  schedule:
    - cron: "37 1 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set release variables
        run: |-
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download source dat files
        run: |-
          curl -fsSL --tlsv1.3 -o c4u-geoip.dat \
            https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat
          curl -fsSL --tlsv1.3 -o c4u-geosite.dat \
            https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat
          curl -fsSL --tlsv1.3 -o ls-geoip.dat \
            https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat
          curl -fsSL --tlsv1.3 -o ls-geosite.dat \
            https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat
          curl -fsSL --tlsv1.3 -o v2fly-geoip.dat \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -fsSL --tlsv1.3 -o v2fly-geosite.dat \
            https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          curl -fsSL --tlsv1.3 -o iran.dat \
            https://github.com/bootmortis/iran-hosted-domains/releases/latest/download/iran.dat

      - name: Generate dat files
        run: |-
          mkdir -p release artifacts
          shopt -s nullglob

          publish() {
            local src="$1"
            local release_dest="$2"
            local artifact_name="$3"

            mv "$src" "$release_dest"
            cp "$release_dest" "artifacts/${artifact_name}"
            sha256sum "$release_dest" | cut -d' ' -f1 | tee "${release_dest}.sha256" "artifacts/${artifact_name}.sha256" > /dev/null
          }

          for config_dir in config/*/; do
            name="$(basename "$config_dir")"
            mkdir -p "release/${name}"

            if [ -f "config/${name}/geoip.json" ]; then
              go run ./cmd/geoip -config "config/${name}/geoip.json"
              publish geoip.dat "release/${name}/geoip.dat" "${name}_geoip.dat"
              for srs in geoip-*.srs; do
                base="$(basename "$srs")"
                publish "$srs" "release/${name}/${base}" "${name}_${base}"
              done
            fi

            if [ -f "config/${name}/geosite.json" ]; then
              go run ./cmd/geosite -config "config/${name}/geosite.json"
              publish geosite.dat "release/${name}/geosite.dat" "${name}_geosite.dat"
              for srs in geosite-*.srs; do
                base="$(basename "$srs")"
                publish "$srs" "release/${name}/${base}" "${name}_${base}"
              done
            fi
          done

      - name: Push artifacts to release branch
        run: |-
          cd release || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin release

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: release
          draft: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
